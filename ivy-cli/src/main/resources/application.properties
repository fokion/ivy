quarkus.banner.enabled=false
quarkus.log.level=WARN
quarkus.log.category."io.quarkus".level=WARN
# stdout belongs to the command: reports, and the protocol of `ivy mcp`
quarkus.log.console.stderr=true

# native binary
quarkus.native.resources.includes=xyz/fokion/ivy/cli/docs/*.md,xyz/fokion/ivy/core/output/report.html,xyz/fokion/ivy/core/version.properties,META-INF/services/xyz.fokion.ivy.spi.Connector
quarkus.ssl.native=true
quarkus.native.additional-build-args=--enable-url-protocols=http\\,https

# bundled JDBC drivers (SQLite) load native code
quarkus.package.jar.manifest.attributes."Enable-Native-Access"=ALL-UNNAMED
