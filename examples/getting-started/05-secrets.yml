# Secrets never reach the console, ivy.log or any report (they show as __hidden__).
#   IVY_SECRET_api_key=abc-123-xyz ivy run examples/getting-started/05-secrets.yml --output-dir out
#   grep -r abc-123-xyz out || echo "not in any report"
name: secrets
secrets: [password]               # this variable is always hidden, wherever it is set
vars:
  password: s3cr3t-value
  api_key: ""                      # empty unless given as a secret (see above)
testcases:
- name: the real value is used, the reports show __hidden__
  steps:
  - script: echo "logging in with ${password}"
    assertions:
    - result.stdout == "logging in with s3cr3t-value"

# A value given on the command line as a secret is hidden too, without being listed in `secrets`:
- name: a secret from the environment
  if: api_key != ""
  steps:
  - script: echo "key=${api_key}"
    assertions:
    - result.stdout == "key=abc-123-xyz"
