name: CI build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: gradle
      - name: Build and test
        run: ./gradlew build

  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ivy-report/package-lock.json
      - name: Build the HTML report
        working-directory: ivy-report
        run: npm ci && npm run check && npm test && npm run build
      - name: The committed report is up to date
        run: cmp ivy-report/dist/index.html ivy-core/src/main/resources/xyz/fokion/ivy/core/output/report.html

  connectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: gradle
      - name: Connector integration tests (Testcontainers)
        run: ./gradlew integrationTest
