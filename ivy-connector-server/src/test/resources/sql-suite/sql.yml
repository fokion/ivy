# sql connector suite: a SQLite file and in-memory DDL
name: sql integration testsuite

testcases:
- name: test-sqlite
  steps:
   - type: sql
     driver: sqlite
     dsn: "sql/sqlite.db"
     commands:
       - "SELECT * FROM test_table;"
     assertions:
       - result.queries.length == 1
       - result.queries[0].rows[0].name == "test row 1"

- name: test-sqlite-memory
  steps:
   - type: sql
     driver: sqlite
     dsn: ":memory:"
     commands:
       - "CREATE TABLE t (id INTEGER, label TEXT)"
       - "INSERT INTO t VALUES (1, 'one'), (2, 'two')"
       - "SELECT id, label FROM t ORDER BY id"
     assertions:
       - result.queries.length == 3
       - result.queries[2].rows.length == 2
       - result.queries[2].rows[1].id == 2
       - result.queries[2].rows[1].label == "two"
