pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        mavenLocal()
    }
    plugins {
        id "${quarkusPluginId}" version "${quarkusPluginVersion}"
    }
}
rootProject.name = 'ivy'

include 'ivy-api', 'ivy-core', 'ivy-cli', 'ivy-connector-server', 'connectors:sql'
