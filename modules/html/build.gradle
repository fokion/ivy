plugins {
    id 'java'
}

group = 'xyz.fokion.modules'
version = '0.0.1'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':modules:core')
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}