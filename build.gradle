allprojects {
    group = 'xyz.fokion'
    version = '0.0.1'

    repositories {
        mavenCentral()
        mavenLocal()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    dependencies {
        testImplementation platform("org.junit:junit-bom:${junitVersion}")
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testImplementation 'org.junit.jupiter:junit-jupiter-params'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-parameters'
    }

    test {
        useJUnitPlatform()
    }
}

// Connector bundles: the connector classes plus their dependencies under lib/, loaded by ivy in
// an isolated class loader. Dependencies to embed go in the 'bundled' configuration.
configure(subprojects.findAll { it.path.startsWith(':connectors:') }) {
    configurations {
        bundled
        implementation.extendsFrom bundled
    }

    dependencies {
        compileOnly project(':ivy-api')
        testImplementation project(':ivy-api')
    }

    tasks.register('bundle', Jar) {
        group = 'build'
        description = 'Assembles the connector bundle loaded by ivy'
        archiveBaseName = "ivy-connector-${project.name}"
        destinationDirectory = layout.buildDirectory.dir('bundle')
        from sourceSets.main.output
        into('lib') {
            from configurations.bundled
        }
        manifest {
            attributes(
                    'Ivy-Bundle-Name': project.name,
                    'Ivy-Bundle-Version': project.version,
                    'Ivy-Framework-Version': ivyFrameworkVersion)
        }
    }

    tasks.named('assemble') {
        dependsOn 'bundle'
    }
}
